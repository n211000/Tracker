<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSC CGL Syllabus</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#26332d;background:#f7f8f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9e4;padding:18px max(18px,calc((100% - 900px)/2));font-weight:700;font-size:18px}.page{width:min(900px,100% - 32px);margin:34px auto}.intro{margin-bottom:22px}.intro h1{margin:0 0 5px;font-size:27px;letter-spacing:-.5px}.intro p{margin:0;color:#728078;font-size:14px}.subjects{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.subject-btn{border:1px solid #dfe5df;background:#fff;border-radius:9px;padding:9px 13px;color:#526159;cursor:pointer}.subject-btn.active{background:#315f4d;color:#fff;border-color:#315f4d}.subject-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 14px}.subject-title h2{font-size:21px;margin:0}.small{font-size:13px;color:#748078}.category{border:1px solid #e2e7e1;background:white;border-radius:11px;margin:10px 0;overflow:hidden}.cat-head{width:100%;background:white;border:0;padding:13px 15px;text-align:left;display:flex;align-items:center;gap:9px;font-weight:650;color:#29362f;cursor:pointer}.arrow{color:#839088}.cat-body{border-top:1px solid #edf0ec;padding:4px 14px}.topic{min-height:44px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f2ef}.topic:last-child{border-bottom:0}.topic label{flex:1;font-size:14px;cursor:pointer}.topic input[type=checkbox]{width:17px;height:17px;accent-color:#39765b;cursor:pointer}.delete{border:0;background:transparent;color:#a0aaa3;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:17px;line-height:1}.delete:hover{color:#b3443e;background:#fff0ef}.add-row{display:flex;gap:8px;padding:10px 0 12px}.add-row input{flex:1;min-width:0;border:1px solid #e0e6df;border-radius:8px;padding:8px 10px;outline:none}.add-row input:focus{border-color:#7aa28a}.add{border:1px solid #d9e5dc;background:#f0f6f1;color:#315f4d;border-radius:8px;padding:7px 11px;font-weight:600;cursor:pointer}.empty{padding:22px;text-align:center;color:#78847c;background:#fff;border:1px dashed #dce3dc;border-radius:10px}.hidden{display:none}@media(max-width:560px){header{padding:15px 16px}.page{margin:24px auto}.intro h1{font-size:24px}.subject-title{align-items:flex-start;flex-direction:column;gap:3px}.subjects{gap:6px}.subject-btn{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<header>SSC CGL Syllabus</header>
<main class="page"><div class="intro"><h1>My syllabus</h1><p>Select a subject, then tick topics as you complete them. Add or remove topics whenever you like.</p></div><nav id="subjects" class="subjects" aria-label="Subjects"></nav><div id="content"></div></main>
<script>
const initial={
"English":{"Grammar":["Parts of Speech","Noun","Pronoun","Verb","Adjective","Adverb","Articles","Prepositions","Conjunctions","Tenses","Subject-Verb Agreement","Modals","Active and Passive Voice","Direct and Indirect Speech","Non-finite Verbs","Infinitives","Gerunds","Participles","Conditional Sentences","Question Tags","Degrees of Comparison","Sentence Structure","Parallelism"],"Vocabulary":["Synonyms","Antonyms","One Word Substitution","Idioms and Phrases","Phrasal Verbs","Homonyms and Homophones","Commonly Confused Words","Spelling","Word Usage"],"Error Detection and Sentence Improvement":["Spotting Errors","Sentence Improvement","Sentence Correction","Phrase Replacement","Fill in the Blanks","Double Fillers"],"Reading Comprehension":["Reading Comprehension","Main Idea","Inference","Vocabulary in Context","Tone and Purpose","Fact and Conclusion Based Questions"],"Sentence and Paragraph Arrangement":["Sentence Rearrangement","Para Jumbles","Sentence Parts Arrangement","Paragraph Coherence"],"Cloze Test":["Grammar-Based Cloze Test","Vocabulary-Based Cloze Test","Context-Based Cloze Test"]},
"Quantitative Aptitude":{"Number System":["Number System Basics","Whole Numbers","Decimals and Fractions","Simplification","Approximation","HCF and LCM","Surds and Indices"],"Percentage":["Basic Percentage","Percentage Increase and Decrease","Successive Percentage Change"],"Ratio and Proportion":["Ratio","Proportion","Partnership","Mixture and Alligation"],"Average":["Basic Average","Weighted Average"],"Profit and Loss":["Profit and Loss Basics","Discount","Marked Price","Successive Discount"],"Simple and Compound Interest":["Simple Interest","Compound Interest"],"Time and Work":["Basic Time and Work","Work Efficiency","Pipes and Cisterns"],"Time, Speed and Distance":["Basic Speed, Time and Distance","Relative Speed","Trains","Boats and Streams"],"Other Arithmetic Topics":["Problems on Ages"],"Algebra":["Basic Algebraic Identities","Linear Equations","Quadratic Equations","Algebraic Expressions"],"Geometry":["Lines and Angles","Triangles","Congruence and Similarity","Circles","Quadrilaterals","Polygons"],"Mensuration · 2D":["Square","Rectangle","Triangle","Circle","Other Basic Figures"],"Mensuration · 3D":["Cube","Cuboid","Cylinder","Cone","Sphere","Hemisphere"],"Trigonometry":["Basic Trigonometric Ratios","Standard Values","Trigonometric Identities","Complementary Angles","Heights and Distances"],"Data Interpretation":["Tables","Bar Graphs","Pie Charts","Line Graphs","Mixed Data Interpretation"],"Statistics and Probability":["Mean","Median","Mode","Basic Probability"]},
"Reasoning":{"Verbal Reasoning":["Analogy","Classification","Series","Coding and Decoding","Blood Relations","Direction and Distance","Order and Ranking","Alphabet Test","Word Formation","Venn Diagrams","Syllogism","Statement and Conclusion","Logical Reasoning"],"Non-Verbal Reasoning":["Figure Analogy","Figure Classification","Figure Series","Mirror Images","Water Images","Paper Folding and Cutting","Embedded Figures","Figure Completion"],"Analytical Reasoning":["Mathematical Operations","Missing Number","Number Series","Letter Series","Mixed Series","Logical Arrangement"]},
"General Awareness":{"History":["Ancient Indian History","Medieval Indian History","Modern Indian History","Indian National Movement","Important Historical Events"],"Geography":["Physical Geography","Indian Geography","World Geography","Environment and Geography"],"Indian Polity":["Constitution","Fundamental Rights and Duties","Parliament","President and Prime Minister","Judiciary","Constitutional and Non-Constitutional Bodies","Centre-State Relations"],"Economics":["Basic Economics","Indian Economy","Banking","Budget and Economic Terms","Important Government Economic Schemes"],"Physics":["Mechanics","Heat","Light","Sound","Electricity","Magnetism","Basic Modern Physics"],"Chemistry":["Basic Chemistry","Matter","Acids, Bases and Salts","Metals and Non-Metals","Chemical Reactions","Everyday Chemistry"],"Biology":["Human Body","Nutrition","Diseases","Plants","Animals","Cell and Basic Biology"],"Environment":["Ecology","Biodiversity","Climate Change","Environmental Issues"],"Static General Knowledge":["Important Books and Authors","Awards and Honours","Important Days","National and International Organizations","Countries and Capitals","Important Places","Art and Culture","Sports"],"Current Affairs":["National Current Affairs","International Current Affairs","Government Schemes and Policies","Economy and Business","Science and Technology","Sports","Awards and Appointments"]}};
const storageKey='ssc-cgl-simple-syllabus-v1';let syllabus;try{syllabus=JSON.parse(localStorage.getItem(storageKey))||initial}catch{syllabus=initial}let selected=Object.keys(syllabus)[0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(storageKey,JSON.stringify(syllabus))}
function render(){document.querySelector('#subjects').innerHTML=Object.keys(syllabus).map(s=>`<button class="subject-btn ${selected===s?'active':''}" data-subject="${esc(s)}">${esc(s)}</button>`).join('');document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{selected=b.dataset.subject;render()});let groups=syllabus[selected]||{};document.querySelector('#content').innerHTML=`<div class="subject-title"><h2>${esc(selected)}</h2><span class="small">Check a box when you finish a topic</span></div>${Object.keys(groups).map(cat=>`<section class="category"><button class="cat-head"><span class="arrow">⌄</span>${esc(cat)} <span class="small">· ${groups[cat].length} topics</span></button><div class="cat-body">${groups[cat].map((topic,i)=>`<div class="topic"><input type="checkbox" id="t-${i}-${encodeURIComponent(cat)}" data-done="${esc(cat)}" data-index="${i}" ${topic.done?'checked':''}><label for="t-${i}-${encodeURIComponent(cat)}">${esc(topic.name)}</label><button class="delete" title="Delete this topic" aria-label="Delete ${esc(topic.name)}" data-delete="${esc(cat)}" data-index="${i}">×</button></div>`).join('')}<form class="add-row" data-add="${esc(cat)}"><input name="topic" placeholder="Add a topic…" aria-label="New topic for ${esc(cat)}"><button class="add" type="submit">Add</button></form></div></section>`).join('')}`;
document.querySelectorAll('[data-done]').forEach(cb=>cb.onchange=()=>{let list=syllabus[selected][cb.dataset.done],i=Number(cb.dataset.index);list[i].done=cb.checked;save()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let cat=b.dataset.delete,i=Number(b.dataset.index);if(confirm(`Delete “${syllabus[selected][cat][i].name}” from this topic list?`)){syllabus[selected][cat].splice(i,1);save();render()}});document.querySelectorAll('[data-add]').forEach(form=>form.onsubmit=e=>{e.preventDefault();let input=form.elements.topic,name=input.value.trim();if(!name)return;syllabus[selected][form.dataset.add].push({name,done:false});save();render()});document.querySelectorAll('.cat-head').forEach(btn=>btn.onclick=()=>{btn.nextElementSibling.classList.toggle('hidden');btn.querySelector('.arrow').textContent=btn.nextElementSibling.classList.contains('hidden')?'›':'⌄'})}
// Upgrade topic strings from the original syllabus into editable checkbox records.
for(const groups of Object.values(syllabus))for(const [cat,list] of Object.entries(groups))groups[cat]=list.map(item=>typeof item==='string'?{name:item,done:false}:item);
save();render();
</script>
</body>
</html>
